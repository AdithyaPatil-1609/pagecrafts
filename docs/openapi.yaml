openapi: 3.1.0
info:
  title: Pagecrafts API
  version: 1.0.0
  description: Frozen Day 1 API contract.
servers:
  - url: /api/v1
paths:
  /generate:
    post:
      operationId: generateSite
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSiteRequest'
      responses:
        '202':
          description: Generation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSiteResult'
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner's projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResult'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResult'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectRequest'
      responses:
        '200':
          description: Updated project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProject
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project removed (our row only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectFiles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project working tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFilesResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putProjectFiles
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  $ref: '#/components/schemas/FileMap'
      responses:
        '200':
          description: Updated project working tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFilesResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/commits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectCommits
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Save points for this project, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommitsResult'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProjectCommit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitRequest'
      responses:
        '201':
          description: Save point created. An unchanged tree returns the existing sha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommitResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/edit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: proposeProjectEdit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProjectRequest'
      responses:
        '200':
          description: Proposed single-file edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/publish:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
    post:
      operationId: publishProject
      security:
        - sessionCookie: []
      responses:
        '202':
          description: Publish accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDeployment
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Publish state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: API failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    Category:
      type: string
      enum: [portfolio, restaurant, saas, blog, event, resume, agency, store, nonprofit, other]
    FileMap:
      type: object
      additionalProperties:
        type: string
    GenerateSiteRequest:
      type: object
      required: [projectIntent, prompt]
      properties:
        projectIntent:
          $ref: '#/components/schemas/Category'
        prompt:
          type: string
          minLength: 1
          maxLength: 500
        attributes:
          type: object
          properties:
            tone:
              type: array
              items:
                type: string
            paletteHint:
              type: array
              items:
                type: string
    GenerateSiteResponse:
      type: object
      required: [projectId, commitSha, sections, warnings, generationId]
      properties:
        projectId:
          type: string
          format: uuid
        commitSha:
          type: string
        sections:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        generationId:
          type: string
          format: uuid
    ProjectStatus:
      type: string
      enum: [draft, pending, provisioning, pushing, enabling_hosting, verifying, live, failed]
    SiteMeta:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        faviconAssetId:
          type: string
        ogImageAssetId:
          type: string
    ProjectSummary:
      type: object
      required: [id, name, status, liveUrl, thumbnailUrl, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        liveUrl:
          type: [string, 'null']
          format: uri
        thumbnailUrl:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [sourceTemplateId, contentJson, siteMeta, formEndpoint]
          properties:
            sourceTemplateId:
              type: [string, 'null']
              format: uuid
            contentJson:
              type: object
              additionalProperties: true
            siteMeta:
              $ref: '#/components/schemas/SiteMeta'
            formEndpoint:
              type: [string, 'null']
              format: uri
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        sourceTemplateId:
          type: string
          format: uuid
        mode:
          const: generate
        prompt:
          type: string
          maxLength: 500
    CreateProjectResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        firstCommit:
          type: string
        jobId:
          type: string
    PatchProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        siteMeta:
          $ref: '#/components/schemas/SiteMeta'
        formEndpoint:
          type: [string, 'null']
          format: uri
    ProjectListResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectSummary'
    ProjectDetailResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/ProjectDetail'
    CreateProjectResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/CreateProjectResponse'
    DeleteResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [deleted]
          properties:
            deleted:
              const: true
    ProjectFilesResponse:
      type: object
      required: [projectId, files, updatedAt]
      properties:
        projectId:
          type: string
          format: uuid
        files:
          $ref: '#/components/schemas/FileMap'
        updatedAt:
          type: string
          format: date-time
    Commit:
      type: object
      required: [sha, message, author, createdAt]
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        message:
          type: string
          minLength: 1
          maxLength: 500
        author:
          type: string
          enum: [user, ai_edit, system]
        createdAt:
          type: string
          format: date-time
    ListCommitsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Commit'
    CreateCommitRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
    CreateCommitResponse:
      type: object
      required: [sha]
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
    EditProjectRequest:
      type: object
      required: [filePath, instruction, currentContent]
      properties:
        filePath:
          type: string
          minLength: 1
        instruction:
          type: string
          minLength: 1
          maxLength: 1000
        currentContent:
          type: string
    EditProjectResponse:
      type: object
      required: [diff, requiresAccept, autoCommitSha]
      properties:
        diff:
          type: object
          required: [before, after]
          properties:
            before:
              type: string
            after:
              type: string
        requiresAccept:
          const: true
        autoCommitSha:
          type: string
    PublishProjectResponse:
      type: object
      required: [deploymentId, status]
      properties:
        deploymentId:
          type: string
          format: uuid
        status:
          const: pending
    DeploymentResponse:
      type: object
      required: [status, repoUrl, liveUrl, commitSha, error]
      properties:
        status:
          type: string
          enum: [pending, live, failed]
        repoUrl:
          type: [string, 'null']
          format: uri
        liveUrl:
          type: [string, 'null']
          format: uri
        commitSha:
          type: [string, 'null']
        error:
          type: [string, 'null']
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, rate_limited, spend_capped, validation_failed, generation_failed, payment_required, hosting_error, internal]
        message:
          type: string
        detail:
          type: string
    GenerateSiteResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/GenerateSiteResponse'
    ProjectFilesResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/ProjectFilesResponse'
    ListCommitsResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/ListCommitsResponse'
    CreateCommitResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/CreateCommitResponse'
    EditProjectResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/EditProjectResponse'
    PublishProjectResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/PublishProjectResponse'
    DeploymentResult:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: '#/components/schemas/DeploymentResponse'
    ErrorResult:
      type: object
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          $ref: '#/components/schemas/Error'
